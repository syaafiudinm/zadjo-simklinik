# Infrastruktur dev SIM Klinik.
#
# Port sengaja digeser dari default (3307, bukan 3306) supaya tidak bentrok dengan
# MySQL/MariaDB bawaan XAMPP yang mungkin sudah jalan di mesin developer.
#
# MySQL 8 dipakai — bukan MariaDB — karena produksi memakai MySQL 8 dan perbedaan
# perilaku JSON, CTE, serta indeks di antara keduanya cukup untuk membuat bug
# yang hanya muncul di produksi.
services:
  mysql:
    image: mysql:8.4
    container_name: simklinik-mysql
    restart: unless-stopped
    ports:
      - "${DOCKER_MYSQL_PORT:-3307}:3306"
    environment:
      # Root = kredensial `tenancy_admin`. Koneksi pusat aplikasi memakai user
      # terbatas yang dibuat oleh `make db-users` (docker/mysql/central-user.sql).
      MYSQL_ROOT_PASSWORD: "${TENANCY_ADMIN_DB_PASSWORD:-secret}"
      MYSQL_ROOT_HOST: "%"
    command:
      # Provisioning tenant (S1-04) membuat database + user MySQL saat runtime,
      # jadi jangan pernah menurunkan privilege root container ini.
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      # Satu koneksi per request per tenant — lihat PRD 5.4 poin 5.
      - --max-connections=500
    volumes:
      - simklinik-mysql:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-p${TENANCY_ADMIN_DB_PASSWORD:-secret}"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    container_name: simklinik-redis
    restart: unless-stopped
    ports:
      - "${DOCKER_REDIS_PORT:-6379}:6379"
    volumes:
      - simklinik-redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20

  # Menangkap semua email keluar di lokal: undangan admin tenant dan reset
  # password bisa dibuka di http://localhost:8025 tanpa SMTP sungguhan.
  mailpit:
    image: axllent/mailpit:latest
    container_name: simklinik-mailpit
    restart: unless-stopped
    ports:
      - "${DOCKER_MAILPIT_SMTP_PORT:-1025}:1025"
      - "${DOCKER_MAILPIT_UI_PORT:-8025}:8025"

volumes:
  simklinik-mysql:
  simklinik-redis:
